apiVersion: apps/v1
kind: Deployment
metadata:
  name: mybank-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: mybank-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mybank-api
    spec:
      serviceAccountName: mybank-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AWS_REGION
              value: __AWS_REGION__
            - name: CUSTOMERS_TABLE
              value: __CUSTOMERS_TABLE__
            - name: ACCOUNTS_TABLE
              value: __ACCOUNTS_TABLE__
            - name: TRANSFERS_TABLE
              value: __TRANSFERS_TABLE__
            - name: APP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mybank-api
                  key: api-key
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
