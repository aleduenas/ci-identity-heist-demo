apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mybank-api-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mybank-api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Native NetworkPolicy cannot select DynamoDB by hostname or AWS prefix list.
    # Route tables use the gateway endpoint; application IAM limits table access.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # EKS Pod Identity agent credential endpoint (IPv4 cluster).
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
