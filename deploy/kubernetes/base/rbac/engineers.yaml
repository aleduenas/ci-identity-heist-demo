apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mybank-engineer
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mybank-engineers
subjects:
  - kind: Group
    name: mybank:engineers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mybank-engineer
  apiGroup: rbac.authorization.k8s.io
