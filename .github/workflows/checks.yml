name: Reusable checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests identity scripts
      - run: pytest tests
      - name: Build containers and smoke-test real local transactions
        env:
          APP_API_KEY: ci-only-synthetic-transaction-smoke-key
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up --build --wait --wait-timeout 180
          python scripts/checks/local_api.py

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.3'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate without AWS credentials or state access
        shell: bash
        run: |
          set -euo pipefail
          for directory in infra/bootstrap infra/environments/sandbox; do
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate
          done

  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Install checksum-verified kubeconform
        shell: bash
        run: |
          set -euo pipefail
          release=https://github.com/yannh/kubeconform/releases/download/v0.7.0
          curl --fail --silent --show-error --location "$release/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform-linux-amd64.tar.gz
          echo 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  /tmp/kubeconform-linux-amd64.tar.gz' | sha256sum --check --strict -
          tar -xzf /tmp/kubeconform-linux-amd64.tar.gz -C /tmp kubeconform
      - name: Validate Kubernetes schemas without a live cluster
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize deploy/kubernetes/base > /tmp/mybank.yaml
          /tmp/kubeconform -strict -summary -kubernetes-version 1.35.0 /tmp/mybank.yaml
      - name: Test immutable images and permission boundaries
        run: python -m unittest discover -s scripts/deploy -p 'test_*.py'
