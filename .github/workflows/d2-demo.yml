name: D2 identity-boundary exercise

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/d2/**', '.github/workflows/d2-demo.yml']
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['scripts/d2/demo_probe.py']

permissions:
  contents: read

jobs:
  identity-probe:
    if: >-
      vars.D2_DEMO_ROLE_ARN != '' &&
      (github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      D2_DEMO_ROLE_ARN: ${{ vars.D2_DEMO_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_STS_REGIONAL_ENDPOINTS: regional
      D2_SESSION_NAME: release-looking-demo
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3==1.42.21
      - name: Install checksum-verified kubectl
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl
          echo "3cfeaf80be482b435b0aa214aff6e0b2c312ee23c0ff20810c75517b6004c6eb  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - name: Execute PR-editable probe (grabs the identity; on a PR, demonstrates impact)
        run: python scripts/d2/demo_probe.py
