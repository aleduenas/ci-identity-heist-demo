services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ../generated:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  keycloak-data:
