x-app-environment: &app-environment
  AWS_REGION: ca-central-1
  AWS_ACCESS_KEY_ID: localfake
  AWS_SECRET_ACCESS_KEY: localfake
  DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
  CUSTOMERS_TABLE: mybank-customers
  ACCOUNTS_TABLE: mybank-accounts
  TRANSFERS_TABLE: mybank-transfers
  APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY to a random lab API key}

services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:8001:8000"

  seed:
    build: .
    image: mybank-api:local
    command: ["python", "-m", "app.fixtures.seed", "--local"]
    environment: *app-environment
    depends_on:
      dynamodb:
        condition: service_started
    restart: on-failure:5

  api:
    build: .
    image: mybank-api:local
    environment: *app-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
